name: Review acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    name: synthetic review browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pinned browser test tooling
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Review the synthetic corpus in desktop, mobile and no-script modes
        run: python -m examples.review_demo --output "$RUNNER_TEMP/review-browser" --browser
      - name: Summarize the expected-regression fixture
        shell: bash
        run: |
          printf '## Synthetic review acceptance\n\nTested checkout: `%s`.\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'The toy candidate intentionally fails its replay gate. This job passes only when the expected regression and browser assertions pass.\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/review-browser/review/pr-comment-aggregate.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/review-browser/browser/*.png
            ${{ runner.temp }}/review-browser/browser/browser-check.json
            ${{ runner.temp }}/review-browser/hostile-browser/*.png
            ${{ runner.temp }}/review-browser/hostile-browser/browser-check.json
            ${{ runner.temp }}/review-browser/demo-result.json
          if-no-files-found: error
          retention-days: 7

  installed-wheel:
    name: isolated installed-wheel review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build the wheel and install it without runtime dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0"
          python -m build --wheel --outdir "$RUNNER_TEMP/review-wheels"
          python -m venv "$RUNNER_TEMP/review-environment"
          "$RUNNER_TEMP/review-environment/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/review-wheels/*.whl
      - name: Exercise the installed CLI outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE" "$RUNNER_TEMP/review-environment/bin/python" -I "$GITHUB_WORKSPACE/examples/check_installed_review.py" --output "$RUNNER_TEMP/installed-review"
      - name: Retain installed-wheel check result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-review/installed-check.json
          if-no-files-found: error
          retention-days: 7
