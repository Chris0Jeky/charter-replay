name: Action self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  action:
    name: uses ./ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Replay the toy regression
        id: regression
        uses: ./
        continue-on-error: true
        with:
          baseline: python examples/toy-guard/guard_v1.py
          candidate: python examples/toy-guard/guard_v2.py
          corpus: charter_replay/corpora/charter
          output: ${{ runner.temp }}/action-regression
      - name: Assert the regression step failed with the regression gate
        shell: bash
        env:
          OUTCOME: ${{ steps.regression.outcome }}
          EXIT_CODE: ${{ steps.regression.outputs.exit-code }}
          GATE: ${{ steps.regression.outputs.gate }}
          OUT: ${{ steps.regression.outputs.output-dir }}
          SUMMARY_SOURCE: ${{ steps.regression.outputs.summary-source }}
        run: |
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
          test "$GATE" = regression
          # The summary step reports the file it appended (full mode: summary.md).
          test "$SUMMARY_SOURCE" = summary.md
          test -n "$OUT"
          grep -q 'newly-allowed' "$OUT/summary.md"
          grep -q '| newly-allowed | 4 |' "$OUT/summary.md"
          grep -q '"newly-allowed": 4' "$OUT/summary.json"

      - name: Replay identical hooks
        id: identical
        uses: ./
        with:
          baseline: python examples/toy-guard/guard_v1.py
          candidate: python examples/toy-guard/guard_v1.py
      - name: Assert the identical run passed
        shell: bash
        env:
          OUTCOME: ${{ steps.identical.outcome }}
          EXIT_CODE: ${{ steps.identical.outputs.exit-code }}
          GATE: ${{ steps.identical.outputs.gate }}
          OUT: ${{ steps.identical.outputs.output-dir }}
        run: |
          test "$OUTCOME" = success
          test "$EXIT_CODE" = 0
          test "$GATE" = pass
          test -f "$OUT/summary.json"

      - name: Pass command substitution and backticks as a baseline
        id: injected-baseline
        uses: ./
        continue-on-error: true
        with:
          baseline: 'python examples/toy-guard/guard_v1.py $(touch injected-marker) `touch injected-marker2`'
          candidate: python examples/toy-guard/guard_v2.py
      - name: Pass command substitution as fail-on
        id: injected-fail-on
        uses: ./
        continue-on-error: true
        with:
          baseline: python examples/toy-guard/guard_v1.py
          candidate: python examples/toy-guard/guard_v1.py
          fail-on: 'newly-allowed$(touch injected-marker3)'
      - name: Assert the inputs reached the CLI as data
        shell: bash
        env:
          BASELINE_CODE: ${{ steps.injected-baseline.outputs.exit-code }}
          FAIL_ON_CODE: ${{ steps.injected-fail-on.outputs.exit-code }}
          FAIL_ON_GATE: ${{ steps.injected-fail-on.outputs.gate }}
        run: |
          # The action ran both times (an exit code exists) ...
          test -n "$BASELINE_CODE"
          # ... the CLI rejected the malformed fail-on as invalid input ...
          test "$FAIL_ON_CODE" = 2
          test "$FAIL_ON_GATE" = error
          # ... and no substitution executed anywhere it could have written.
          found="$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -name 'injected-marker*' -print)"
          if [ -n "$found" ]; then
            echo "::error::marker file created: $found"
            exit 1
          fi

      - name: Replay the toy regression with an aggregate-only summary
        id: aggregate
        uses: ./
        continue-on-error: true
        with:
          baseline: python examples/toy-guard/guard_v1.py
          candidate: python examples/toy-guard/guard_v2.py
          corpus: charter_replay/corpora/charter
          output: ${{ runner.temp }}/action-aggregate
          summary-mode: aggregate
      - name: Assert the aggregate summary carries no toy-corpus family name
        shell: bash
        env:
          OUTCOME: ${{ steps.aggregate.outcome }}
          EXIT_CODE: ${{ steps.aggregate.outputs.exit-code }}
          OUT: ${{ steps.aggregate.outputs.output-dir }}
          AGGREGATE_PATH: ${{ steps.aggregate.outputs.aggregate-path }}
          SUMMARY_SOURCE: ${{ steps.aggregate.outputs.summary-source }}
          CASES: ${{ github.workspace }}/charter_replay/corpora/charter/cases.jsonl
        run: |
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
          test -f "$AGGREGATE_PATH"
          # The summary step itself reports what it appended: aggregate.md, never
          # summary.md (which carries the family names).
          test "$SUMMARY_SOURCE" = aggregate.md
          py=""
          for candidate in python3 python; do
            if "$candidate" -c 'import sys' >/dev/null 2>&1; then
              py="$candidate"
              break
            fi
          done
          test -n "$py"
          # A step's own GITHUB_STEP_SUMMARY file is not readable from a later
          # step, so the appended source is asserted through the summary-source
          # output above and the content of that file below.
          "$py" - <<'PY'
          import json
          import os

          out = os.environ["OUT"]
          with open(os.environ["CASES"], encoding="utf-8") as handle:
              cases = [json.loads(line) for line in handle if line.strip()]
          names = {case["case_family"] for case in cases}
          names |= {case["event_id"] for case in cases}
          assert len(names) > 20, names
          with open(os.path.join(out, "aggregate.md"), encoding="utf-8") as handle:
              markdown = handle.read()
          with open(os.environ["AGGREGATE_PATH"], encoding="utf-8") as handle:
              text = handle.read()
          assert markdown.startswith("<!-- charter-replay:aggregate.v1 -->"), markdown[:80]
          assert json.loads(text)["counts"]["newly-allowed"] == 4
          for name in sorted(names):
              assert name not in markdown, name
              assert name not in text, name
          # The full summary still holds them, so the check above is meaningful.
          with open(os.path.join(out, "summary.json"), encoding="utf-8") as handle:
              full = handle.read()
          assert all(name in full for name in {c["case_family"] for c in cases})
          PY

      - name: Reject an unknown summary-mode before anything runs
        id: bad-mode
        uses: ./
        continue-on-error: true
        with:
          baseline: python examples/toy-guard/guard_v1.py
          candidate: python examples/toy-guard/guard_v1.py
          summary-mode: 'full$(touch injected-marker4)'
      - name: Assert the unknown summary-mode was rejected
        shell: bash
        env:
          OUTCOME: ${{ steps.bad-mode.outcome }}
          OUT: ${{ steps.bad-mode.outputs.output-dir }}
        run: |
          test "$OUTCOME" = failure
          test -z "$OUT"
          test ! -e "$GITHUB_WORKSPACE/injected-marker4"

      - name: Replay a flooding candidate with a small hook output limit
        id: output-limit
        uses: ./
        continue-on-error: true
        with:
          baseline: python examples/toy-guard/guard_v1.py
          candidate: python charter_replay/tests/fixtures/hooks/output_hook.py stdout-flood 1024
          corpus: charter_replay/corpora/charter
          hook-output-limit: '1024'
          output: ${{ runner.temp }}/action-output-limit
      - name: Assert the flood was cut off as an output-limit source failure
        shell: bash
        env:
          OUTCOME: ${{ steps.output-limit.outcome }}
          EXIT_CODE: ${{ steps.output-limit.outputs.exit-code }}
          GATE: ${{ steps.output-limit.outputs.gate }}
          OUT: ${{ steps.output-limit.outputs.output-dir }}
        run: |
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 3
          test "$GATE" = error
          test -f "$OUT/summary.json"
          # Every candidate hook was killed at the limit and recorded as
          # output-limit; the baseline stayed under it.
          grep -q '"output-limit": 50' "$OUT/summary.json"
          grep -q '"code": "hook-output-limit"' "$OUT/summary.json"

      - name: Reject a malformed hook-output-limit as invalid input
        id: bad-limit
        uses: ./
        continue-on-error: true
        with:
          baseline: python examples/toy-guard/guard_v1.py
          candidate: python examples/toy-guard/guard_v1.py
          hook-output-limit: '10$(touch injected-marker5)'
      - name: Assert the malformed limit reached the CLI as data
        shell: bash
        env:
          EXIT_CODE: ${{ steps.bad-limit.outputs.exit-code }}
          GATE: ${{ steps.bad-limit.outputs.gate }}
        run: |
          test "$EXIT_CODE" = 2
          test "$GATE" = error
          test ! -e "$GITHUB_WORKSPACE/injected-marker5"
